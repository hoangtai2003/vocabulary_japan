# Production: toàn bộ app trên một server, một tên miền. Chạy từ thư mục gốc repo:
#   cp .env.example .env   (rồi sửa)
#   docker compose up -d --build
# Hướng dẫn đầy đủ: DEPLOY.md. (PostgreSQL cho phát triển nằm ở vocabulary_japan_be/docker-compose.yml.)
#
# Internet → web (Caddy :80/:443, HTTPS tự động)
#              ├─ /      → file tĩnh của frontend
#              └─ /api/* → api:4000 (Node) → db:5432 (PostgreSQL)
# Chỉ web mở cổng ra ngoài; api và db chỉ nằm trong mạng nội bộ của compose.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jpvocab
      # Chỉ có tác dụng lần đầu tạo volume; đổi sau đó phải đổi cả trong PostgreSQL (DEPLOY.md).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: jpvocab
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jpvocab -d jpvocab']
      interval: 5s
      timeout: 3s
      retries: 10

  # Chạy migration rồi thoát; api chỉ khởi động khi bước này thành công.
  migrate:
    image: jpvocab-api
    build: ./vocabulary_japan_be
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment: &api-env
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://jpvocab:${POSTGRES_PASSWORD}@db:5432/jpvocab
      CORS_ORIGIN: ${PUBLIC_URL:?Đặt PUBLIC_URL trong .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: lax
      SESSION_TTL_DAYS: 30
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      LOG_LEVEL: info
      PORT: 4000
      # Caddy gọi API qua mạng nội bộ Docker (dải IP riêng), không phải localhost.
      TRUST_PROXY: uniquelocal
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    image: jpvocab-api
    build: ./vocabulary_japan_be
    restart: unless-stopped
    init: true
    environment: *api-env
    volumes:
      # Ảnh của bài đọc đề thi (SRS 2.0, NFR-EX-10): sao lưu cùng database, xem DEPLOY.md.
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:4000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  web:
    image: jpvocab-web
    build: ./vocabulary_japan_fe
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Đặt SITE_ADDRESS trong .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
