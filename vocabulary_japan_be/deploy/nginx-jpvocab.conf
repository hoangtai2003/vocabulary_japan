# Nginx cho Sổ luyện chữ: một domain phục vụ cả frontend (file tĩnh) và API (/api → Node).
# Cài: sudo cp deploy/nginx-jpvocab.conf /etc/nginx/sites-available/jpvocab
#      sudo ln -s /etc/nginx/sites-available/jpvocab /etc/nginx/sites-enabled/
#      sudo rm -f /etc/nginx/sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx
# Đổi ten-mien-cua-ban.vn thành tên miền thật. HTTPS: sudo certbot --nginx -d ten-mien-cua-ban.vn
# (certbot tự thêm khối listen 443 và chuyển hướng HTTP → HTTPS vào file này).

server {
    listen 80;
    listen [::]:80;
    server_name ten-mien-cua-ban.vn;

    root /var/www/jpvocab;
    index index.html;

    # Body tối đa 6 MB (API tự giới hạn JSON ở 1 MB).
    client_max_body_size 6m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Header bảo mật cho trang frontend (API tự đặt header bằng helmet).
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # API: chuyển sang Node ở 127.0.0.1:4000. X-Forwarded-* để Express (trust proxy) biết IP
    # thật của người dùng (rate limit) và biết request đến qua HTTPS.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # File build có hash trong tên: cache dài hạn, không bao giờ đổi nội dung.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Mọi đường dẫn khác: file tĩnh nếu có, không thì index.html để React Router xử lý
    # (tải lại ở /tu-vung, /quan-tri... không bị 404). Không cache index.html, để bản deploy
    # mới có hiệu lực ngay.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }
}
